name: open-design

# Multi-tenant production deploy. Used by Coolify.
# All secrets come from Coolify env vars or a sibling .env.production file
# (gitignored). Never commit real credentials.
#
# Required env vars (see deploy/.env.example for the full list):
#   POSTGRES_PASSWORD       - random strong secret
#   DATABASE_URL            - postgres://open_design:${POSTGRES_PASSWORD}@postgres:5432/open_design
#   SUPABASE_URL            - https://<project>.supabase.co
#   SUPABASE_JWT_SECRET     - HS256 secret OR set SUPABASE_JWKS_URL
#   OD_ALLOWED_ORIGINS      - https://app.<your-domain> (strict, comma-separated)
#   ANTHROPIC_API_KEY       - shared key used by all tenants
#   OPENAI_API_KEY          - shared key used by all tenants
#   APP_DOMAIN              - app.<your-domain>
#   API_DOMAIN              - api.<your-domain>

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: open-design-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-open_design}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-open_design}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - open_design_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-open_design} -d ${POSTGRES_DB:-open_design}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    # Postgres is not exposed to the public; the daemon talks to it on
    # the internal compose network only.

  open-design:
    container_name: open-design
    image: ${OPEN_DESIGN_IMAGE:-docker.io/vanjayak/open-design:latest}
    build:
      context: ${BLAIQ_BUILD_CONTEXT:-..}
      dockerfile: ${BLAIQ_DOCKERFILE:-deploy/Dockerfile}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ops-brain:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BLAIQ_OPS_BRAIN_URL: http://ops-brain:8010
      BLAIQ_OPS_BRAIN_ENABLED: "true"
      OPS_BRAIN_TRUST_TOKEN: ${OPS_BRAIN_TRUST_TOKEN:?OPS_BRAIN_TRUST_TOKEN required}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: 7456
      OD_DATA_DIR: /data
      OD_ALLOWED_ORIGINS: ${OD_ALLOWED_ORIGINS:?OD_ALLOWED_ORIGINS required}
      OD_PG_SSL: ${OD_PG_SSL:-disable}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      OD_SESSION_SECRET: ${OD_SESSION_SECRET:?OD_SESSION_SECRET required (32+ random bytes)}
      OD_COOKIE_INSECURE: ${OD_COOKIE_INSECURE:-}
      OD_SIGNUP_ENABLED: ${OD_SIGNUP_ENABLED:-0}
      OD_SEED_ADMIN_EMAIL: ${OD_SEED_ADMIN_EMAIL:-}
      OD_SEED_ADMIN_PASSWORD: ${OD_SEED_ADMIN_PASSWORD:-}
      OD_SEED_ADMIN_DISPLAY_NAME: ${OD_SEED_ADMIN_DISPLAY_NAME:-}
      OD_SEED_TENANT_NAME: ${OD_SEED_TENANT_NAME:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      # Route the bundled Claude Code CLI agent through OpenRouter (Anthropic
      # Messages API at /api/v1/messages) so MissionBuilder agent missions run
      # server-side with no direct Anthropic key. Auth token = the OpenRouter key.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://openrouter.ai/api}
      ANTHROPIC_AUTH_TOKEN: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-anthropic/claude-sonnet-4.6}
      ANTHROPIC_SMALL_FAST_MODEL: ${ANTHROPIC_SMALL_FAST_MODEL:-anthropic/claude-haiku-4.5}
      # OpenRouter's Anthropic-compat doesn't surface thinking tokens, which made
      # the CLI return empty results. Disable interleaved/extended thinking so the
      # text response comes through cleanly.
      DISABLE_INTERLEAVED_THINKING: ${DISABLE_INTERLEAVED_THINKING:-1}
      MAX_THINKING_TOKENS: ${MAX_THINKING_TOKENS:-0}
      APP_DOMAIN: ${APP_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      OD_RUN_MIGRATIONS: "1"
    ports:
      - "${OPEN_DESIGN_PORT:-7456}:7456"
    volumes:
      - open_design_data:/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-2g}
    pids_limit: 512
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ops-brain:
    container_name: ops-brain
    build:
      context: ../apps/ops-brain
      dockerfile: Dockerfile
    restart: always
    # default → postgres + open-design; blaiq-mcp → the external Poool MCP
    # container. Only these two services share blaiq-mcp, so `postgres` still
    # resolves on default (no hostname collision).
    networks:
      - default
      - blaiq-mcp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${OPS_BRAIN_DATABASE_URL:?OPS_BRAIN_DATABASE_URL required}
      OPS_BRAIN_TRUST_TOKEN: ${OPS_BRAIN_TRUST_TOKEN:?OPS_BRAIN_TRUST_TOKEN required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Daemon base URL for the ClickUp poller's bidirectional sync calls
      # (/api/v1/org/clickup/*). Reaches the open-design daemon on the
      # internal compose network. Overridable per deploy.
      BLAIQ_DAEMON_URL: ${BLAIQ_DAEMON_URL:-http://open-design:7456}
      AITEAM_LOG_LEVEL: ${AITEAM_LOG_LEVEL:-INFO}
      # Outbound notification channel (A6 / workflow steps 3a.3, 3a.7, delivery).
      # All optional + empty by default → notifications stay "logged" (safe).
      # To go live: set ENABLED=1 + SMTP host/from (+ user/pass). SAFETY:
      # set REDIRECT_TO to an operator inbox to route EVERY send there until you
      # deliberately remove it — nothing reaches a real client while it is set.
      BLAIQ_NOTIFY_EMAIL_ENABLED: ${BLAIQ_NOTIFY_EMAIL_ENABLED:-}
      BLAIQ_NOTIFY_SMTP_HOST: ${BLAIQ_NOTIFY_SMTP_HOST:-}
      BLAIQ_NOTIFY_SMTP_PORT: ${BLAIQ_NOTIFY_SMTP_PORT:-587}
      BLAIQ_NOTIFY_SMTP_USER: ${BLAIQ_NOTIFY_SMTP_USER:-}
      BLAIQ_NOTIFY_SMTP_PASS: ${BLAIQ_NOTIFY_SMTP_PASS:-}
      BLAIQ_NOTIFY_FROM: ${BLAIQ_NOTIFY_FROM:-}
      BLAIQ_NOTIFY_REDIRECT_TO: ${BLAIQ_NOTIFY_REDIRECT_TO:-}
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_pg:
  open_design_data:

networks:
  default:
  # Shared bridge to the externally-managed Poool MCP container. Create + attach
  # poool-mcp once: `docker network create blaiq-mcp; docker network connect blaiq-mcp poool-mcp`.
  blaiq-mcp:
    external: true
